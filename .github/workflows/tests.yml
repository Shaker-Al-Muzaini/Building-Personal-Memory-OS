name: Run Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  tests:
    name: PHP ${{ matrix.php-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, bcmath, intl, json, mysql, sqlite3
          ini-values: post_max_size=256M, upload_max_filesize=256M
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # تم دمج تشغيل الاختبارات في خطوة واحدة أو باستخدام الفلاتر الصحيحة
      - name: Run Unit Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        # الطريقة الصحيحة لتشغيل الـ Unit tests فقط في Laravel
        run: php artisan test --testsuite=Unit

      - name: Run Feature Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --testsuite=Feature

      - name: Generate Coverage Report (clover)
        run: |
          composer require phpunit/phpunit --dev
          php artisan test --coverage-clover=coverage.xml
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # يفضل إضافة التوكن إذا كان المستودع خاص
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
