[phases.setup]
nixPkgs = ['php83', 'nodejs', 'npm']

[phases.build]
dependsOn = ['install']
cmds = [
    'composer install --no-interaction --optimize-autoloader',
    'npm install',
    'npm run build',
    'php artisan key:generate',
    'php artisan optimize'
]

[phases.start]
cmd = 'php artisan serve --host 0.0.0.0 --port $PORT'
